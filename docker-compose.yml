# One-command start:  docker compose up --build
# Then open http://localhost:8080   (run `docker compose exec backend node src/seed.js` once for demo data)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]

  ai-service:
    build: ./ai-service
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/smart_assessment
      JWT_SECRET: change_this_to_a_long_random_string
      AI_SERVICE_URL: http://ai-service:8000
      FACULTY_INVITE_CODE: FACULTY2026
      CLIENT_ORIGIN: http://localhost:8080
    depends_on: [mongo, ai-service]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  mongo_data:
